# Goal : Build the image for DevBoard Frontend and push to Docker hub
name: CI

on:
  push:
    branches: [master]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Setup 
        uses: docker/setup-docker-action@v5
        with:
           daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
