# Goal: Build the image for DevBoard Frontend and push to Docker Hub
name: CI

on:
  push:
    branches: [ "master" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Code checkout (v4 latest stable version hai)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Buildx setup (Multi-platform aur fast build ke liye)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub Login (Push karne ke liye ye zaroori hai)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Image build aur Docker Hub par push karega
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest
