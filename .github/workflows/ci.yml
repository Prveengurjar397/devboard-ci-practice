# Goal : Build the image for DevBoard Frontend and push to Docker hub , after linting code
name: CI 

on: 
  push:
    branches: [master]

jobs:
  code-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    # Step 1: Clone the repository onto the runner
      - name: Checkout Code
        uses: actions/checkout@v7
# Step 2: Set up node.js environment and enable npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your preferred node version
         
    # Step 3: Install a clean slate of dependencies
      - name: Install Dependencies
        run: npm install
    # Step 4: Execute the lint command from package.json
      - name: Run Linter
        run: npm run lint
      
  build-and-push:
    needs: [code-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest
